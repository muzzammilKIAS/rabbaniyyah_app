name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /rabbaniyyah_app/
      # Rabbaniyyah Mountain Challenge: mod Solo statik di /rabbaniyyah_app/mountain/ (tanpa pelayan, terus dibuka)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: rabbaniyyah-mountain
      - run: npx vite build --outDir ../build/web/mountain --emptyOutDir
        working-directory: rabbaniyyah-mountain
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
