name: rabbaniyyah_app
description: "في رحاب اللغة العربية الربانية — modul pembelajaran interaktif Bahasa Arab (3 fasal semester), KIAS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  flutter_tts: ^4.2.2
  just_audio: ^0.9.42
  video_player: ^2.9.5
  path_provider: ^2.1.5
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/dalil/
    - assets/video/
    - assets/audio/tts/
    - assets/audio/tts_dars12/
    - assets/audio/tts_dars13/
    - assets/audio/tts_dars14/
    - assets/audio/tts_dars15/
    - assets/audio/tts_dars16/
    - assets/audio/tts_dars17/
    - assets/audio/tts_dars18/
    - assets/audio/tts_dars19/
    - assets/audio/tts_dars110/
    - assets/audio/tts_dars111/
    - assets/audio/tts_dars112/
    - assets/audio/quran/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf
        - asset: assets/fonts/amiri/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/amiri_quran/AmiriQuran-Regular.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Variable.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
